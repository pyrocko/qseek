name: Deploy

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/deploy.yaml"
      - "pyproject.toml"
      - "setup.py"
      - "src/qseek/ext/**"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest # x86_64
          - ubuntu-24.04-arm # aarch64
          - macos-latest # arm64
          - macos-15-intel # x86_64

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # setuptools_scm derives the version from the git tags

      # cibuildwheel's uv build frontend requires uv on macOS
      - uses: astral-sh/setup-uv@v10.2.0

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.1

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  make_sdist:
    name: Make SDist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # setuptools_scm derives the version from the git tags

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Build SDist
        run: uv build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  tests:
    name: Tests
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/tests.yaml

  pypi-publish:
    name: Upload release to PyPI
    if: startsWith(github.ref, 'refs/tags/') # only publish to PyPI on tag pushes
    needs: [tests, build_wheels, make_sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/qseek
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - name: Download all the wheels and sdists
        uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
