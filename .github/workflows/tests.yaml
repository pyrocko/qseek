name: Pre-commit and Tests

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      debug:
        description: "Open a tmate session when a test job fails"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: j178/prek-action@v3.0.0

  test:
    needs: prek
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v7
      - name: Install uv with Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install libomp on macOS
        if: runner.os == 'macOS'
        run: |
          brew install libomp
          echo 'LDFLAGS="-L/opt/homebrew/opt/libomp/lib"' >> $GITHUB_ENV
          echo 'CPPFLAGS="-I/opt/homebrew/opt/libomp/include"' >> $GITHUB_ENV

      - name: Install package
        run: |
          uv sync --dev
      - name: Test with pytest
        run: |
          uv run pytest -m "not plot"
      - name: Setup tmate session
        if: ${{ failure() && github.event_name == 'workflow_dispatch' && inputs.debug }}
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 15
        with:
          limit-access-to-actor: true

  build_docs:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Install uv with Python 3.12
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install package
        run: |
          uv sync --all-extras
      - name: Build docs
        run: |
          uv run mkdocs build
