name: Pre-commit and Tests

on:
  pull_request:
  push:
    branches:
      - main
  # Called by the deploy workflow before publishing a release
  workflow_call:
  workflow_dispatch:
    inputs:
      debug:
        description: "Open a tmate session when a test job fails"
        type: boolean
        default: false

concurrency:
  # A fixed name, a called workflow shares github.workflow with its caller
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # ty finds the project's .venv and resolves third-party imports from it.
      # It only reads the dependencies' types, so the package itself is not
      # built (src/qseek/ext/*.pyi stub the C extensions) and PyTorch is the
      # small CPU wheel.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install dependencies for ty
        run: |
          uv venv
          uv pip install --torch-backend cpu --extra ui --extra completion -r pyproject.toml
      - uses: j178/prek-action@v3.0.0

  test:
    needs: prek
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v7
      - name: Install uv with Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install libomp on macOS
        if: runner.os == 'macOS'
        run: |
          brew install libomp
          echo 'LDFLAGS="-L/opt/homebrew/opt/libomp/lib"' >> $GITHUB_ENV
          echo 'CPPFLAGS="-I/opt/homebrew/opt/libomp/include"' >> $GITHUB_ENV

      - name: Install package
        run: |
          uv sync --dev
      - name: Test with pytest
        run: |
          uv run pytest -m "not plot"
      - name: Setup tmate session
        if: ${{ failure() && github.event_name == 'workflow_dispatch' && inputs.debug }}
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 15
        with:
          limit-access-to-actor: true
