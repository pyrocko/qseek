site_name: Qseek
site_description: Data-driven earthquake detection and localization for large seismic data sets.
site_author: Marius Isken
site_url: https://pyrocko.github.io/qseek/

repo_url: https://github.com/pyrocko/qseek
repo_name: pyrocko/qseek
edit_uri: edit/main/docs/
copyright: Qseek is free software, licensed under the GNU General Public License v3.

theme:
  name: material
  custom_dir: overrides
  logo: images/logo-dark.svg
  favicon: images/logo-q.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  icon:
    repo: fontawesome/brands/github
  features:
    - announce.dismiss
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/pyrocko/qseek
      name: Qseek on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/qseek/
      name: Qseek on PyPI

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/octree-hero.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.blocks.caption
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

watch:
  - src/qseek

plugins:
  - search
  - redirects:
      redirect_maps:
        getting_started.md: getting-started/installation.md
        visualizing_results.md: results/explore.md
        benchmark.md: about/benchmark.md
        components/configuration.md: configuration/index.md
        components/general.md: configuration/conventions.md
        components/octree.md: configuration/search-volume.md
        components/station_metadata.md: configuration/stations.md
        components/waveform_data.md: configuration/waveforms.md
        components/pre_processing.md: configuration/pre-processing.md
        components/ray_tracer.md: configuration/ray-tracers.md
        components/image_function.md: configuration/image-functions.md
        components/distance_weighting.md: configuration/distance-weighting.md
        components/magnitudes.md: configuration/magnitudes.md
        components/feature_extraction.md: configuration/features.md
        components/station_corrections.md: configuration/station-corrections.md
        components/callbacks.md: configuration/callbacks.md
        api/overview.md: reference/api/index.md
        api/models.md: reference/api/detections.md
        api/stations.md: reference/api/stations.md
        api/octree.md: configuration/search-volume.md
        api/ray_tracer.md: reference/api/modules.md
        api/images.md: reference/api/modules.md
        api/utils.md: reference/api/utils.md
  - markdown-exec
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://docs.pydantic.dev/latest/objects.inv
            - https://numpy.org/doc/stable/objects.inv
          options:
            extensions:
              - griffe_pydantic:
                  schema: false
            inherited_members: true
            show_signature_annotations: true
            show_symbol_type_toc: true
            separate_signature: true
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            filters: ["!^_", "!^model_"]
            show_source: false
            show_symbol_type_heading: true
            signature_crossrefs: true
            summary: true

nav:
  - Home: index.md
  - Get started:
      - Installation: getting-started/installation.md
      - Quick start: getting-started/quick-start.md
      - Playground: getting-started/playground.md
      - Set up your own search: getting-started/first-search.md
  - Concepts:
      - How Qseek works: concepts/how-it-works.md
  - Guides:
      - Tune the detection: guides/tune-detection.md
      - Real-time monitoring: guides/real-time.md
      - Performance: guides/performance.md
      - Manage runs: guides/manage-runs.md
      - Relocate with HypoDD: guides/relocate-hypodd.md
  - Results:
      - Run directory: results/run-directory.md
      - Explore results: results/explore.md
      - Exporters: results/exporters.md
  - Configuration:
      - configuration/index.md
      - Conventions: configuration/conventions.md
      - Stations: configuration/stations.md
      - Waveforms: configuration/waveforms.md
      - Pre-processing: configuration/pre-processing.md
      - Image functions: configuration/image-functions.md
      - Ray tracers: configuration/ray-tracers.md
      - Search volume: configuration/search-volume.md
      - Distance weighting: configuration/distance-weighting.md
      - Station corrections: configuration/station-corrections.md
      - Magnitudes: configuration/magnitudes.md
      - Event features: configuration/features.md
      - Callbacks: configuration/callbacks.md
  - Reference:
      - Command line: reference/cli.md
      - Extending Qseek: reference/extending.md
      - Python API:
          - reference/api/index.md
          - Detections: reference/api/detections.md
          - Stations: reference/api/stations.md
          - Module base classes: reference/api/modules.md
          - Utilities: reference/api/utils.md
  - About:
      - Showcase: about/showcase.md
      - Benchmark: about/benchmark.md
      - Related projects: about/related-projects.md
